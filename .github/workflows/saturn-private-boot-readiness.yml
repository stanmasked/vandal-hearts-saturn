name: Stage93 original-source boot-readiness preflight (fabricated only)
on:
  push:
    branches:
      - "stage93/**"
  pull_request:
    branches:
      - "stage92/**"
permissions:
  contents: read
jobs:
  source-iso-integrity:
    name: Complete fake Saturn image preflight (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Stage93 invented Track1+Track2+CUE and ISO9660 hashes
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_saturn_private_boot_readiness.py -v
          python -m unittest discover -s tests -p test_saturn_private_track1_range_retrieval.py -v
          python -m unittest discover -s tests -p test_saturn_private_split_cue_preflight.py -v
          python -m unittest discover -s tests -p test_saturn_iso.py -v
          echo "STAGE93_FAKE_DISC_CHAIN_BOOT_PREFLIGHT_PASS"
      - name: Ensure no Saturn images or archives are tracked
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = {".bin", ".cue", ".iso", ".chd", ".rom", ".zip", ".7z"}
          assert not any(Path(p).suffix.lower() in blocked for p in files if p)
          print("STAGE93_NO_PRIVATE_DISC_BYTES_IN_CHECKOUT")
          PY
