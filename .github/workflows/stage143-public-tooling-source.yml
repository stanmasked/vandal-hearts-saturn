name: Stage143 public private-runner tooling source bundle

on:
  pull_request:
    paths:
      - '.github/workflows/stage143-public-tooling-source.yml'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export Python tooling only
        run: |
          set -euo pipefail
          test -d tools
          mkdir -p stage143-tools-export
          cp -R tools stage143-tools-export/tools
          if find stage143-tools-export -type f ! -name '*.py' | grep -q .; then
            echo 'Unexpected non-Python file in source-only export' >&2
            exit 1
          fi
          test -f stage143-tools-export/tools/saturn_private_prologue_continue_tenth_c.py
          test -f stage143-tools-export/tools/saturn_private_capture_archive_gate.py
          test -f stage143-tools-export/tools/saturn_private_archived_pair_audit.py
          ( cd stage143-tools-export && find tools -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS )
          test "$(find stage143-tools-export/tools -type f -name '*.py' | wc -l)" -gt 100
      - name: Upload source-only tooling artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage143-public-tooling-source
          path: stage143-tools-export/
          retention-days: 1
          if-no-files-found: error
