name: Host regression tests (ROM-free)
concurrency:
  group: host-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out --parallel 2
      - name: Test C++
        run: ctest --test-dir out --output-on-failure
      - name: Prepare Python image-test environment
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --disable-pip-version-check Pillow
      - name: Test disc metadata and framebuffer parsers (synthetic only)
        run: .ci-python/bin/python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify native-to-Python framebuffer checksum contract
        run: .ci-python/bin/python -m tools.check_visual_bridge --binary out/vh_visual_fixture --output out/visual-bridge-report.json
      - name: Stage69 Python export to C++ terrain parser round-trip (synthetic only)
        run: .ci-python/bin/python -m tools.check_terrain_bridge --binary out/vh_terrain_probe --output out/terrain-bridge-report.json
      - name: Stage71 synthetic grid size/elevation matrix through compiled C++
        run: .ci-python/bin/python -m tools.check_terrain_matrix --binary out/vh_terrain_probe --output out/terrain-matrix-report.json
