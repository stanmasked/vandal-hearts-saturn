name: Stage145 build pinned Yabause with isolated twelfth-C input

on:
  push:
    branches:
      - 'stage144/eleventh-c-prologue'
  pull_request:
    paths:
      - '.github/workflows/stage145-pinned-twelfth-c-runner.yml'
      - '.github/workflows/stage144-public-tooling-source.yml'
      - 'tools/patch_yabause_private_twelfth_confirm.py'
      - 'tools/patch_yabause_private_durable_pad_receipts.py'
      - 'tools/patch_yabause_private_tenth_confirm.py'
      - 'tools/patch_yabause_strict_split_cue.py'
      - 'tests/test_yabause_private_twelfth_confirm.py'
      - 'tools/saturn_private_stage143_archive_gate.py'
      - 'tools/saturn_private_stage144_archive_gate.py'
      - 'tools/saturn_private_stage145_archive_gate.py'
      - 'tests/test_saturn_private_stage144_archive_gate.py'
      - 'tests/test_saturn_private_stage145_archive_gate.py'
      - 'tools/saturn_private_stage145_capture_packager.py'
      - 'tests/test_saturn_private_stage145_capture_packager.py'
      - 'tools/saturn_private_cross_stage_prefix_drift.py'
      - 'tests/test_saturn_private_cross_stage_prefix_drift.py'
      - 'tests/test_saturn_private_prologue_continue_twelfth_c_runner.py'
      - 'tools/patch_yabause_private_eleventh_confirm.py'
      - 'tools/patch_yabause_private_durable_pad_receipts.py'
      - 'tools/patch_yabause_private_tenth_confirm.py'
      - 'tests/test_yabause_private_eleventh_confirm.py'
      - 'tools/saturn_private_prologue_continue_eleventh_c_audit.py'
      - 'tests/test_saturn_private_prologue_continue_eleventh_c_audit.py'
      - 'tests/test_saturn_private_stage143_archive_gate.py'
      - 'tools/saturn_private_prologue_continue_twelfth_c.py'
      - 'tools/saturn_private_prologue_continue_twelfth_c_audit.py'
      - 'tests/test_saturn_private_prologue_continue_twelfth_c_audit.py'
      - 'tests/test_yabause_private_tenth_confirm.py'
      - 'tests/test_yabause_private_ninth_confirm.py'
      - 'tests/test_yabause_private_durable_pad_receipts.py'
      - 'tests/test_saturn_stage143_visual_witness_gate.py'
      - 'tests/test_saturn_stage142_partial_receipts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-stage145-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pillow pixel decoder for visual regressions
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
      - name: Fetch exact public Yabause source
        run: |
          set -euo pipefail
          git init -q external-yabause
          git -C external-yabause remote add origin https://github.com/Yabause/yabause.git
          git -C external-yabause fetch --quiet --depth 1 origin 7e38821dbac265490f115e163c523a939acda759
          test "$(git -C external-yabause rev-parse FETCH_HEAD)" = 7e38821dbac265490f115e163c523a939acda759
          git -C external-yabause checkout --quiet --detach FETCH_HEAD
      - name: Fetch pinned public PNG codec
        run: |
          set -euo pipefail
          git init -q external-lodepng
          git -C external-lodepng remote add origin https://github.com/lvandeve/lodepng.git
          git -C external-lodepng fetch --quiet --depth 1 origin e584a8490db1b76b81bf298c11c09d3b55d9c270
          test "$(git -C external-lodepng rev-parse FETCH_HEAD)" = e584a8490db1b76b81bf298c11c09d3b55d9c270
          git -C external-lodepng checkout --quiet --detach FETCH_HEAD
          test "$(git hash-object external-lodepng/lodepng.cpp)" = 4915ed7a1ddc827559eb42b8968924a61454f2e6
          test "$(git hash-object external-lodepng/lodepng.h)" = 8f789b677668a495f641336cf62f3afe0b98a80d
          mkdir -p external-yabause/yabause/src/runner/lodepng
          cp external-lodepng/lodepng.cpp external-lodepng/lodepng.h external-yabause/yabause/src/runner/lodepng/
      - name: Patch pinned CD reader and Stage145 twelfth-C runner
        run: |
          set -euo pipefail
          python3 -m tools.patch_yabause_strict_split_cue --source external-yabause/yabause/src/cdbase.c --output external-yabause/yabause/src/cdbase.instrumented.c
          mv external-yabause/yabause/src/cdbase.instrumented.c external-yabause/yabause/src/cdbase.c
          python3 -m tools.patch_yabause_private_twelfth_confirm --source external-yabause/yabause/src/runner/yui.cpp --output external-yabause/yabause/src/runner/yui.instrumented.cpp
          mv external-yabause/yabause/src/runner/yui.instrumented.cpp external-yabause/yabause/src/runner/yui.cpp
      - name: Compile optimized ROM-free Yabause C68K headless runner
        run: |
          set -euo pipefail
          cmake -S external-yabause/yabause -B build-yabause -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DYAB_WANT_OPENGL=OFF -DYAB_WANT_SDL=OFF -DYAB_WANT_OPENAL=OFF -DYAB_USE_SSF=OFF -DYAB_WANT_MUSASHI=OFF -DYAB_WANT_C68K=ON -DYAB_USE_PLAY_JIT=OFF -DYAB_WANT_MPEG=OFF -DYAB_PORTS=runner
          cmake --build build-yabause --target yabause-runner --parallel 2
          test -x build-yabause/src/runner/yabause
      - name: Run inherited and Stage145 source-only synthetic regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_saturn_stage142_partial_receipts.py' -v
          python3 -m unittest discover -s tests -p 'test_yabause_private_ninth_confirm.py' -v
          python3 -m unittest discover -s tests -p 'test_yabause_private_tenth_confirm.py' -v
          python3 -m unittest discover -s tests -p 'test_yabause_private_durable_pad_receipts.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_stage143_visual_witness_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_stage143_archive_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_prologue_continue_eleventh_c_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_yabause_private_eleventh_confirm.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_stage144_archive_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_prologue_continue_twelfth_c_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_prologue_continue_twelfth_c_runner.py' -v
          python3 -m unittest discover -s tests -p 'test_yabause_private_twelfth_confirm.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_stage145_archive_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_stage145_capture_packager.py' -v
          python3 -m unittest discover -s tests -p 'test_saturn_private_cross_stage_prefix_drift.py' -v
      - name: Prepare temporary open-source runner artifact
        run: |
          set -euo pipefail
          mkdir -p stage145-export
          cp build-yabause/src/runner/yabause stage145-export/yabause-stage145
          chmod 755 stage145-export/yabause-stage145
          sha256sum stage145-export/yabause-stage145
          timeout 15s stage145-export/yabause-stage145 > stage145-smoke.txt 2>&1
          grep -Fq 'Not enough command line arguments.' stage145-smoke.txt
      - name: Export only the open-source ROM-free runner
        uses: actions/upload-artifact@v4
        with:
          name: stage145-public-yabause-twelfth-c-runner
          path: stage145-export/yabause-stage145
          retention-days: 1
          if-no-files-found: error
