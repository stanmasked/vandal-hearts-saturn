name: One-time public build artifact cleanup

on:
  push:
    branches:
      - "stage124/**"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  remove-public-build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Remove public artifacts, preserve only live NRO handoffs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts"
          runs_api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/switch-nro.yml/runs"
          declare -a delete_ids=()
          declare -a nro_ids=()
          declare -A artifact_run_ids=()
          page=1
          while :; do
            response="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api?per_page=100&page=$page")"
            count="$(printf '%s' "$response" | jq '.artifacts | length')"
            while IFS=$'\t' read -r id name run_id; do
              [ -n "$id" ] || continue
              if [ "$name" = "vh-saturn-prototype-nro" ]; then
                nro_ids+=("$id")
                artifact_run_ids["$id"]="$run_id"
              else
                delete_ids+=("$id")
              fi
            done < <(printf '%s' "$response" | jq -r '.artifacts[] | select(.expired == false) | [.id, .name, (.workflow_run.id // "")] | @tsv')
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

          delete_artifact() {
            local id="$1" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$api/$id")"
            case "$code" in
              200|204|404) ;;
              *) echo "Artifact deletion failed with HTTP $code" >&2; return 1 ;;
            esac
          }

          for id in "${delete_ids[@]}"; do
            delete_artifact "$id"
          done

          active_ids="$(
            for status in queued in_progress; do
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$runs_api?per_page=100&status=$status" | jq -r '.workflow_runs[].id'
            done | sort -u
          )"
          deleted_nro=0
          retained_active_nro=0
          for id in "${nro_ids[@]}"; do
            run_id="${artifact_run_ids[$id]}"
            if [[ -n "$run_id" ]] && grep -qx "$run_id" <<<"$active_ids"; then
              retained_active_nro=$((retained_active_nro + 1))
              continue
            fi
            delete_artifact "$id"
            deleted_nro=$((deleted_nro + 1))
          done

          active_ids="$(
            for status in queued in_progress; do
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$runs_api?per_page=100&status=$status" | jq -r '.workflow_runs[].id'
            done | sort -u
          )"
          remaining=0
          page=1
          while :; do
            response="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api?per_page=100&page=$page")"
            count="$(printf '%s' "$response" | jq '.artifacts | length')"
            while IFS=$'\t' read -r name run_id; do
              [ -n "$name" ] || continue
              if [ "$name" != "vh-saturn-prototype-nro" ]; then
                remaining=$((remaining + 1))
              elif [[ -z "$run_id" ]] || ! grep -qx "$run_id" <<<"$active_ids"; then
                remaining=$((remaining + 1))
              fi
            done < <(printf '%s' "$response" | jq -r '.artifacts[] | select(.expired == false) | [.name, (.workflow_run.id // "")] | @tsv')
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          test "$remaining" -eq 0
          echo "PUBLIC_ARTIFACT_CLEANUP_PASS deleted_count=$((${#delete_ids[@]} + deleted_nro)) active_nro_handoffs_retained=$retained_active_nro"
